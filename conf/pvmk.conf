# pvmk configuration — read at boot from pvmk.conf on the boot volume.
# Plain text, key=value; edit from AmigaOS with any text editor.

# Serial port ownership: debug (pvmk), guest (pass-through), shared
serial=debug
baud=115200

# Text console on the Amiga display as well as the serial port: on, off
display=on

# Keyboard layout: us, de (Amiga German keyboard),
# de-pc (German PC keyboard in an emulator such as FS-UAE or WinUAE)
keymap=us

# Boot menu at startup (on screen and serial): on, off
menu=on

# Boot mode of kernels picked in the menu's kernel chooser and of entries
# without ,pv or ,native: native (default) or pv (deprivileged under
# SORIX-ILOM-LDOM; with 128 MB AMIX's memory check then takes minutes).
# The menu's m key toggles it for one boot.
mode=native

# Menu entries: entry=label,dev:path[,pv|native]  (up to 8). Without any,
# the menu offers /stand/unix on every AMIX root partition and the AmigaOS
# partition Kickstart would boot. pv = deprivileged under SORIX-ILOM-LDOM.
#entry=AMIX,unix_root:/stand/unix,pv
#entry=AMIX-060,unix_root:/stand/unix-060,pv
#entry=AMIX-native,unix_root:/stand/unix,native
entry=AMIX,UNIX_Root:/stand/unix,native
entry=AmigaOS,DH0,native

# Memory for a native AMIX boot in MB (0 = all of it); boot -m overrides it,
# boot -m 0 gives all.  0: all 256 MB of the Z3660, tested on the A3000
# (cpu_ram2, the firmware's SCSI DMA fix and the kernel's 8 KB ksegtbl).
mem=0

# Default entry (label or dev:path) and countdown in seconds; empty default
# = the menu waits for a choice
default=AMIX
timeout=30

# A deprivileged kernel other than the default that reboots within this
# many seconds hands the next boot back to the default
fallback=60

# Log level 0 (errors) .. 4 (trace)
log=2
